<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Case Simulator + Upgrade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0f1219;
            --bg-card: #181d27;
            --bg-hover: #222938;
            --accent: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --blue: #4b69ff;
            --purple: #8847ff;
            --pink: #d32ce6;
            --red: #eb4b4b;
            --gold: #ffd700;
            --green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background-color: var(--bg-card);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3241;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .balance-box {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--green);
            color: #34d399;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-funds {
            background: var(--green);
            color: #000;
            border: none;
            border-radius: 4px;
            width: 22px;
            height: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Promo Bar */
        .promo-bar {
            background: #131720;
            padding: 10px 15px;
            border-bottom: 1px solid #2a3241;
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .promo-input {
            background: var(--bg-dark);
            border: 1px solid #2a3241;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
            width: 170px;
            text-transform: uppercase;
        }

        .promo-input:focus {
            border-color: var(--accent);
        }

        .promo-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            background: var(--bg-card);
            border-bottom: 1px solid #2a3241;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(245, 158, 11, 0.05);
        }

        /* Main Container */
        .container {
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Cases Grid */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .case-card {
            background: var(--bg-card);
            border: 1px solid #2a3241;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .case-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .case-icon {
            font-size: 3.2rem;
            margin: 8px 0;
        }

        .case-name {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .case-price {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Case Opening View */
        #case-view { display: none; }

        .back-btn {
            background: var(--bg-card);
            border: 1px solid #2a3241;
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 145px;
            background: #0a0c10;
            border: 2px solid #2a3241;
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0;
        }

        .roulette-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: var(--accent);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent);
        }

        .roulette-track {
            display: flex;
            height: 100%;
            align-items: center;
            will-change: transform;
        }

        .roulette-item {
            min-width: 125px;
            height: 125px;
            margin: 0 5px;
            background: var(--bg-card);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            text-align: center;
            border-bottom: 4px solid gray;
        }

        .item-emoji { font-size: 2.3rem; margin-bottom: 5px; }
        .item-weapon { font-size: 0.72rem; color: var(--text-muted); }
        .item-skin {
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .open-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .open-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .contents-title {
            margin: 20px 0 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .contents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }

        /* Upgrade Section */
        .upgrade-arena {
            background: var(--bg-card);
            border: 1px solid #2a3241;
            border-radius: 14px;
            padding: 16px;
            margin-bottom
